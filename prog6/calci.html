<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
*{box-sizing:border-box}
body{margin:40px;font-family:Arial;background:#fff}.calculator{width:300px;margin:auto;padding:20px;border:1px solid;border-radius:10px}#display{width:100%;padding:12px;margin-bottom:10px;border:2px solid;font-size:2rem;text-align:right}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{padding:14px 8px;border:2px solid;border-radius:5px;background:#fff;font-size:1.1rem;cursor:pointer}button:hover{background:#eee}.equals{grid-row:span 2}.zero{grid-column:span 2}
</style></head><body><main class="calculator"><input id="display" value="0" aria-label="Calculator display" readonly><div class="keys"><button onclick="calculator('clear')">AC</button><button onclick="calculator('delete')">DEL</button><button onclick="calculator('operator','/')">÷</button><button onclick="calculator('operator','*')">×</button><button onclick="calculator('number','7')">7</button><button onclick="calculator('number','8')">8</button><button onclick="calculator('number','9')">9</button><button onclick="calculator('operator','-')">−</button><button onclick="calculator('number','4')">4</button><button onclick="calculator('number','5')">5</button><button onclick="calculator('number','6')">6</button><button onclick="calculator('operator','+')">+</button><button onclick="calculator('number','1')">1</button><button onclick="calculator('number','2')">2</button><button onclick="calculator('number','3')">3</button><button class="equals" onclick="calculator('equals')">=</button><button class="zero" onclick="calculator('number','0')">0</button><button onclick="calculator('number','.')">.</button></div></main><script>
const display=document.getElementById('display');function calculator(action,value){calculator.first??=null;calculator.operator??=null;calculator.waiting??=false;if(action==='clear')display.value='0',calculator.first=calculator.operator=null,calculator.waiting=false;else if(action==='delete'&&!calculator.waiting)display.value=display.value.length>1?display.value.slice(0,-1):'0';else if(action==='number'){if(calculator.waiting||display.value==='0'||display.value==='Error')display.value=value==='.'?'0.':value;else if(value!=='.'||!display.value.includes('.'))display.value+=value;calculator.waiting=false}else if(action==='operator'){if(display.value==='Error')display.value='0',calculator.first=0;else calculator.first=+display.value;calculator.operator=value,calculator.waiting=true}else if(action==='equals'&&calculator.operator!==null){let b=+display.value,a=calculator.first,r=calculator.operator==='/'&&b===0?'Error':({' +':a+b,'-':a-b,'*':a*b,'/':a/b}[calculator.operator]);display.value=r==='Error'?r:String(+r.toFixed(10));calculator.first=calculator.operator=null,calculator.waiting=true}}
</script></body></html>
