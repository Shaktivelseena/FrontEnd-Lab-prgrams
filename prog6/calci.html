<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<style>
		* { box-sizing: border-box; }
		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			background: #eef2f7;
			font-family: Arial, sans-serif;
		}
		.calculator {
			width: min(92vw, 340px);
			padding: 20px;
			border-radius: 16px;
			background: #1f2937;
			box-shadow: 0 12px 30px #0003;
		}
		#display {
			width: 100%;
			margin-bottom: 16px;
			padding: 16px;
			border: 0;
			border-radius: 8px;
			background: #f8fafc;
			color: #111827;
			font-size: 2rem;
			text-align: right;
		}
		.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		button {
			padding: 16px 8px;
			border: 0;
			border-radius: 8px;
			background: #374151;
			color: white;
			cursor: pointer;
			font-size: 1.15rem;
		}
		button:hover { background: #4b5563; }
		.operator { background: #2563eb; }
		.operator:hover { background: #1d4ed8; }
		.clear { background: #dc2626; }
		.equals { grid-row: span 2; background: #16a34a; }
		.zero { grid-column: span 2; }
	</style>
</head>
<body>
	<main class="calculator">
		<input id="display" type="text" value="0" aria-label="Calculator display" readonly>
		<div class="keys">
			<button class="clear" onclick="clearDisplay()">AC</button>
			<button onclick="deleteDigit()">DEL</button>
			<button class="operator" onclick="chooseOperator('/')">÷</button>
			<button class="operator" onclick="chooseOperator('*')">×</button>
			<button onclick="appendValue('7')">7</button>
			<button onclick="appendValue('8')">8</button>
			<button onclick="appendValue('9')">9</button>
			<button class="operator" onclick="chooseOperator('-')">−</button>
			<button onclick="appendValue('4')">4</button>
			<button onclick="appendValue('5')">5</button>
			<button onclick="appendValue('6')">6</button>
			<button class="operator" onclick="chooseOperator('+')">+</button>
			<button onclick="appendValue('1')">1</button>
			<button onclick="appendValue('2')">2</button>
			<button onclick="appendValue('3')">3</button>
			<button class="equals" onclick="calculate()">=</button>
			<button class="zero" onclick="appendValue('0')">0</button>
			<button onclick="appendValue('.')">.</button>
		</div>
	</main>
	<script>
		const display = document.getElementById('display');
		let firstNumber = null;
		let operator = null;
		let waitingForNumber = false;

		function appendValue(value) {
			if (waitingForNumber || display.value === '0' || display.value === 'Error') {
				display.value = value === '.' ? '0.' : value;
				waitingForNumber = false;
			} else if (value !== '.' || !display.value.includes('.')) {
				display.value += value;
			}
		}

		function chooseOperator(nextOperator) {
			const current = Number(display.value);
			if (operator && !waitingForNumber) calculate();
			firstNumber = operator && !waitingForNumber ? Number(display.value) : current;
			operator = nextOperator;
			waitingForNumber = true;
		}

		function calculate() {
			if (operator === null || firstNumber === null) return;
			const secondNumber = Number(display.value);
			let result;
			if (operator === '+') result = firstNumber + secondNumber;
			if (operator === '-') result = firstNumber - secondNumber;
			if (operator === '*') result = firstNumber * secondNumber;
			if (operator === '/') result = secondNumber === 0 ? 'Error' : firstNumber / secondNumber;
			display.value = result === 'Error' ? result : String(Number(result.toFixed(10)));
			firstNumber = null;
			operator = null;
			waitingForNumber = true;
		}

		function clearDisplay() {
			display.value = '0';
			firstNumber = null;
			operator = null;
			waitingForNumber = false;
		}

		function deleteDigit() {
			if (!waitingForNumber) display.value = display.value.length > 1 ? display.value.slice(0, -1) : '0';
		}
	</script>
</body>
</html>
